# Application
spring.application.name=cachebench
server.port=8080

#Base de donnees H2 (en memoire)
spring.datasource.url=jdbc:h2:mem:cachebench
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#  Console H2 (interface web pour explorer la BDD)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# ===== Cache Caffeine =====
spring.cache.type=caffeine
spring.cache.cache-names=products,categories,searches
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m,recordStats